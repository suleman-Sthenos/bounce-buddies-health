# The live game's health check (his order, 15 October 2026). Every 3 hours GitHub loads the live game in Chrome, plays it,
# checks the world board, the pages and the security headers, and looks for problems players' games reported in the last
# 3 hours. A failed run emails the person who set this workflow up (GitHub rule for scheduled workflows). Public repo, so free.
name: Live game health check
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Practice alarm: fail on purpose to check the email arrives'
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026 (GitHub's notice on the first run); 24.04 has Chrome at /usr/bin/google-chrome
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the live game
        env:
          CHROME: /usr/bin/google-chrome
        run: node bin/health-check.mjs
      - name: Practice alarm
        if: ${{ inputs.drill }}
        run: |
          echo 'Practice alarm: this run fails on purpose, to check that a failed health check reaches the owner by email.'
          exit 1
